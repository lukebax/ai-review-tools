name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish an in-flight deployment; a newer queued run will publish its own pair.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # The deck uses macOS system fonts; keep export typography consistent.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Reject a superseded source commit
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install fixed export dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Check map and its presentation excerpts
        run: |
          python3 map/build.py --check
          python3 presentation/build_visuals.py --check
      - name: Generate and verify the matching PDF
        run: |
          npm run build:pdf
          npm run check
          npm test
      - name: Save the checked export in the repository
        run: |
          # A normal push rejects a concurrent edit. Never rebase old outputs onto new HTML.
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          git add presentation/index.html presentation/navigating-ai-evidence-synthesis.pdf presentation/pdf-build.json presentation/assets/maps
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update the checked presentation PDF'
            git push origin HEAD:main
          fi
          # GITHUB_TOKEN pushes do not trigger another push workflow.
      - name: Assemble the exact checked site
        run: |
          npm run check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site
      - name: Recheck the source before deployment
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Publish HTML and PDF together
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
